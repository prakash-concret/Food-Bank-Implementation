name: PR Review

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pr-review:
    runs-on: ubuntu-latest
    environment: pr-action
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check Claude token
        id: check-token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set — skipping PR review."
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.check-token.outputs.available == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true # Enables tracking comments
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an expert code reviewer for Element AMS, a Salesforce ISV managed package.

            Follow these steps exactly:

            1. Read `skills/pr-review-validation/SKILL.md` — this is your review framework.
            2. Follow Step 1 in that file: get the list of changed files using:
               gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --name-only
            3. Follow Step 2: for each changed file, identify the matching skill files from the table
               in SKILL.md and read each one using the Read tool.
            4. Follow Step 3: review every changed file using the rules from the loaded skill files
               plus the general checklist in SKILL.md.
            5. Follow Step 4: post all findings as inline PR comments at the relevant lines.

            Only comment on lines that were actually changed in this PR.

          claude_args: |
            --allowedTools "Read,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"