name: PR Review

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pr-review:
    runs-on: ubuntu-latest
    environment: pr-action
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check Claude token
        id: check-token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set — skipping PR review."
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Get changed files (excluding gitignored)
        id: changed-files
        if: steps.check-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --name-only \
            | while read f; do git check-ignore -q "$f" || echo "$f"; done \
            | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - uses: anthropics/claude-code-action@v1
        if: steps.check-token.outputs.available == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true # Enables tracking comments
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an expert code reviewer for Element AMS, a Salesforce ISV managed package.

            The following files were changed in this PR (gitignored files already excluded):
            ${{ steps.changed-files.outputs.files }}

            Follow these steps exactly:

            1. Read `skills/pr-review-validation/SKILL.md` — this is your review framework.
            2. Review only the files listed above using the rules from SKILL.md.
            3. Post all findings as inline PR comments at the relevant lines.

            Only comment on lines that were actually changed in this PR.

          claude_args: |
            --allowedTools "Read,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"